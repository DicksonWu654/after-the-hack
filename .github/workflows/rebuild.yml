# Rebuild the paper and the site data from the shipped files and fail if the committed outputs differ.
name: rebuild
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to full commit SHAs (checkout v4.2.2, setup-python v5.6.0)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install markdown==3.10.2
      - run: python3 scripts/export_paper.py
      - run: python3 -I site/build.py
      - name: Committed outputs must match a fresh build
        run: git diff --exit-code
