<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>After the Hack: thread card</title>
<!--
  Thread cards in the site's design (1600x900 CSS px, rendered at 2x by render.py).
  Every number is read at render time from site/data/bundle.js (window.ATH: canonical numbers, derived values,
  facts, charts, the incident index and the verified on-chain messages) or from window.CARD_EXTRA, which render.py
  fills from data/law_enforcement_cases.csv and site screenshots. Nothing numeric is typed into this file.
  Each number is registered with its source key (b()), and render.py writes the card map from that list.
-->
<style>
@font-face { font-family: "Departure"; src: url("/site/assets/fonts/departure-mono.woff2") format("woff2"); }
@font-face { font-family: "Atkinson"; src: url("/site/assets/fonts/atkinson-next.woff2") format("woff2"); font-weight: 200 800; }
@font-face { font-family: "Atkinson Mono"; src: url("/site/assets/fonts/atkinson-mono.woff2") format("woff2"); font-weight: 200 800; }
:root {
  --bg: #0a0d13; --bg-2: #0f141d; --bg-3: #151c28; --line: #222b3a; --line-2: #2f3b4f;
  --ink: #e7ebf1; --ink-2: #a9b3c3; --ink-3: #7f8aa0;
  --ret: #44e3bf; --oth: #8db8ff; --none: #4a5568; --arr: #ff5c93; --dprk: #ffc34d;
  --hatch: repeating-linear-gradient(135deg, rgba(127,138,160,.34) 0 3px, transparent 3px 12px);
  --display: "Departure", monospace; --body: "Atkinson", sans-serif; --mono: "Atkinson Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
#card {
  position: relative; width: 1600px; height: 900px; overflow: hidden; color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(rgba(169,179,195,.13) 1.6px, transparent 2px);
  background-size: 32px 32px; background-position: 16px 16px;
  font: 400 40px/1.3 var(--body);
}
.top { position: absolute; left: 80px; right: 80px; top: 52px; display: flex; justify-content: space-between; align-items: baseline; }
.logo { font: 400 36px/1 var(--display); letter-spacing: .01em; }
.logo i { font-style: normal; color: var(--arr); }
.tagr { font: 500 28px/1 var(--mono); color: var(--ink-3); letter-spacing: .04em; }
.body { position: absolute; left: 80px; right: 80px; top: 136px; bottom: 96px; }
.foot { position: absolute; left: 80px; right: 80px; bottom: 32px; font: 400 24px/1.25 var(--mono); color: var(--ink-3); }
.kick { font: 500 30px/1 var(--mono); color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 22px; }
.h { font: 400 78px/1.04 var(--display); margin: 0; letter-spacing: -.01em; }
.big { font: 400 250px/.86 var(--display); letter-spacing: -.03em; }
.lab { font: 400 42px/1.22 var(--body); color: var(--ink-2); }
.lab b { color: var(--ink); font-weight: 700; }
.c-ret { color: var(--ret); } .c-oth { color: var(--oth); } .c-arr { color: var(--arr); } .c-dprk { color: var(--dprk); } .c-2 { color: var(--ink-2); }
.panel { background: var(--bg-2); border: 2px solid var(--line-2); border-radius: 4px; }
.panel-h { display: flex; justify-content: space-between; gap: 20px; padding: 16px 26px; border-bottom: 2px solid var(--line); font: 500 27px/1.2 var(--mono); color: var(--ink-3); }
.panel-b { padding: 22px 26px 26px; }
.bar { position: relative; height: 72px; }
.bar .full { position: absolute; inset: 0; background: var(--hatch); border: 2px solid var(--line-2); }
.bar .seg { position: absolute; top: 0; bottom: 0; }
.bar .seg.ret { background: var(--ret); } .bar .seg.oth { background: var(--oth); }
.tag { display: inline-block; font: 500 28px/1 var(--mono); padding: 10px 16px 9px; border: 2px solid currentColor; border-radius: 3px; }
.row { display: flex; gap: 60px; }
.msg { background: var(--bg-2); border: 2px solid var(--line); border-radius: 4px; }
.msg-h { display: flex; justify-content: space-between; gap: 20px; padding: 12px 24px; border-bottom: 2px solid var(--line); font: 500 24px/1.2 var(--mono); white-space: nowrap; color: var(--ink-3); }
.msg-h b { font-weight: 700; }
.msg-t { padding: 14px 24px 18px; font: 400 36px/1.28 var(--body); color: var(--ink); white-space: pre-line; overflow-wrap: anywhere; }
.gap { font: 500 28px/1 var(--mono); color: var(--ink-2); padding: 14px 0 14px 26px; border-left: 2px dashed var(--line-2); margin-left: 40px; }
.key { display: flex; flex-wrap: wrap; gap: 10px 34px; font: 400 27px/1.2 var(--mono); color: var(--ink-2); }
.key span { display: inline-flex; align-items: center; gap: 12px; }
.sw { display: inline-block; width: 26px; height: 26px; }
.sw.ret { background: var(--ret); } .sw.oth { background: var(--oth); } .sw.arr { background: var(--arr); }
.sw.none { background: var(--hatch); border: 2px solid var(--line-2); }
.sw.ol-arr { border: 4px solid var(--arr); } .sw.ol-ink { border: 4px solid var(--ink-3); }
.sw.ink { background: var(--ink); } .sw.ol { border: 4px solid var(--ink-2); }
/* hex ledger cells */
.cells { display: grid; gap: 3px; }
.cells i { display: block; background: #222b3a; }
.cells i.r { background: var(--ret); } .cells i.o { background: var(--oth); } .cells i.c { background: var(--arr); }
/* browser frame */
.frame { position: absolute; border: 2px solid var(--line-2); border-radius: 12px; overflow: hidden; background: var(--bg-2); box-shadow: 0 30px 80px rgba(0,0,0,.55); }
.frame-bar { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: var(--bg-3); border-bottom: 2px solid var(--line); }
.frame-bar i { width: 15px; height: 15px; border-radius: 50%; background: var(--line-2); display: block; }
.frame-url { margin-left: 18px; flex: 1; height: 34px; border-radius: 17px; background: var(--bg); color: var(--ink-2); font: 400 22px/34px var(--mono); padding: 0 20px; white-space: nowrap; overflow: hidden; }
.frame img { display: block; width: 100%; }
</style>
<script src="/site/data/bundle.js"></script>
</head>
<body>
<div id="card"></div>
<script>
(function () {
  "use strict";
  const A = window.ATH, X = window.CARD_EXTRA || {};
  const C = {}, CT = {};
  A.canon.numbers.forEach((n) => { C[n.id] = n.numeric; CT[n.id] = n; });
  const NUMS = [];
  /* register a number shown on the card with its source key, return its display text */
  const b = (text, key) => { NUMS.push([String(text), key]); return String(text); };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const int = (v) => Math.round(v).toLocaleString("en-US");
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const date = (iso) => { const [y, m, d] = iso.slice(0, 10).split("-").map(Number); return `${d} ${MON[m - 1]} ${y}`; };
  const mon = (iso) => { const [y, m] = iso.slice(0, 7).split("-").map(Number); return `${MON[m - 1]} ${y}`; };
  function money(v) {
    if (v >= 1e9) return "$" + (v / 1e9).toFixed(2) + "B";
    if (v >= 1e6) return "$" + (v / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
    if (v >= 1e3) return "$" + Math.round(v / 1e3) + "k";
    return "$" + int(v);
  }
  const pct1 = (v) => (+v).toFixed(1) + "%";
  function need(cond, msg) { if (!cond) throw new Error("card data: " + msg); }
  function rx(cid, field, re) {
    const m = re.exec(CT[cid][field] || "");
    need(m, `${cid}.${field}: pattern not found ${re}`);
    return m;
  }

  /* incident index rows, as on the site */
  const I = A.inc;
  const rows = I.rows.map((a, i) => {
    const m = /(\d{4})(\d{2})(\d{2})/.exec(a[0]);
    const r = { i, id: a[0], name: a[1], loss: a[2] || 0, chain: (I.chains[a[3]] || "").split(";").filter(Boolean).join(", "),
      enf: a[4], rec: a[5], ret: a[6] || 0, oth: a[7] || 0, ch: a[8] || "", dprk: a[9] || 0, alias: a[10] || "",
      date: a[11] || (m ? `${m[1]}-${m[2]}-${m[3]}` : ""), who: a[12] || "", ev: a[13] || "", split: a[14] || "" };
    r.unver = (r.ret > 0 || r.oth > 0) && (r.ev === "x" || "cunvq".includes(r.rec));
    return r;
  });
  const row = (id) => { const r = rows.find((x) => x.id === id); need(r, "index row " + id); return r; };
  const rowBy = (re, pred) => { const r = rows.find((x) => re.test(x.name) && (!pred || pred(x))); need(r, "index row " + re); return r; };
  const Q = Object.fromEntries(A.quotes.map((q) => [q.rank, q]));
  const N = I.rows.length;
  const period = A.built_from.snapshot.period.split("..");
  const ENF = { c: "Someone was arrested or charged for the hack.", l: "Charges only for handling the loot.", v: "Civil or regulatory action only.",
    o: "An arrest on other grounds.", n: "No arrest or charge for this hack found.", u: "Arrest and charge status is not established in this dataset." };
  const DATASET = () => `Source: After the Hack dataset, ${b(int(C.S1.n), "S1.n")} hacks, ${period[0].slice(0, 4)} to ${date(period[1])}.`;

  function gap(a, z) {
    let s = Math.round((Date.parse(z) - Date.parse(a)) / 1000);
    const d = Math.floor(s / 86400); s -= d * 86400;
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    if (d) return `${d}d ${h}h later`;
    if (h) return `${h}h ${m}m later`;
    return `${m}m ${s}s later`;
  }
  const short = (h) => (h && h.length > 14 ? h.slice(0, 8) + "…" + h.slice(-6) : h || "");
  function msg(q, key) {
    q.segments.join(" ").replace(/0x[0-9a-fA-F]+/g, "").replace(/\$?\d[\d,.]*(?:%|M|k| hours)?/g, (m) => { b(m.replace(/[.,]$/, ""), key + ".segments (verbatim)"); return m; });
    const side = q.side === "attacker" ? "c-arr" : "c-oth";
    const t = q.time.replace("T", " ").replace("Z", "");
    return `<div class="msg"><div class="msg-h"><span><b class="${side}">${esc(q.role_label)}</b></span>
      <span>${b(date(q.time), key + ".time")}, ${b(t.slice(11), key + ".time")} UTC · tx ${esc(short(q.hash))}</span></div>
      <div class="msg-t">${q.segments.map(esc).join(q.complete ? "\n" : " [...] ")}</div></div>`;
  }
  function bar(r, h) {
    const w = (v) => Math.max(0, Math.min(100, (v / r.loss) * 100));
    const ret = r.unver ? 0 : r.ret, oth = r.unver ? 0 : r.oth;
    return `<div class="bar" style="${h ? `height:${h}px` : ""}"><span class="full"></span>${ret ? `<span class="seg ret" style="left:0;width:${w(ret)}%"></span>` : ""}${oth ? `<span class="seg oth" style="left:${w(ret)}%;width:${w(oth)}%"></span>` : ""}</div>`;
  }
  const hexOff = (r) => `cell 0x${r.i.toString(16).padStart(3, "0")} of ${int(N)}`;

  /* ============================================================== cards */
  const CARDS = {};

  CARDS.cover = () => {
    const cells = rows.map((r) => `<i class="${r.enf === "c" ? "c" : (!r.unver && r.ret > 0 ? "r" : (!r.unver && r.oth > 0 ? "o" : ""))}"></i>`).join("");
    const nC = rows.filter((r) => r.enf === "c").length;
    need(nC === C.E2.master_all[0], "index arrest cells != E2");
    need(N === C.S1.n, "index rows != S1.n");
    return { tag: "", src: DATASET() + " One square per hack, oldest first.",
      html: `<p class="kick">Crypto hacks since ${b(period[0].slice(0, 4), "built_from.snapshot.period")}</p>
        <div style="font:400 98px/1.04 var(--display);letter-spacing:-.02em;white-space:nowrap">${b(int(C.S1.n), "S1.n")} hacks.<br><span class="c-2">${b("$" + (C.S1.total_usd / 1e9).toFixed(1) + "B", "S1.total_usd")} stolen.</span></div>
        <p style="position:absolute;left:0;bottom:0;width:640px;font:700 56px/1.16 var(--body);margin:0">Only <span class="c-arr">${b(C.E2.master_all[0], "E2.master_all[0]")}</span> are known to have led to an arrest or charge.</p>
        <div style="position:absolute;right:0;bottom:0;width:609px">
          <div class="key" style="margin-bottom:18px;font-size:25px"><span><i class="sw arr"></i>Arrest or charge</span><span><i class="sw ret"></i>Returned</span><span><i class="sw oth"></i>Other recovery</span></div>
          <div class="cells" style="grid-template-columns:repeat(51,9px);grid-auto-rows:9px;gap:3px">${cells}</div></div>` };
  };

  CARDS.ledger = () => {
    const r = C.R2.pct_of_all, o = C.C4.master_pct, u = A.derived.unrecovered_pct.v;
    need(Math.abs(r + o + u - 100) < 0.2, "R2 + C4 + unrecovered != 100");
    const L = { x: 0, y: 196, w: 380, h: 466 }, RX = 900;
    const nodes = [
      { y: 196, h: 124, share: r, cls: "ret", pct: b(pct1(r), "R2.pct_of_all"), usd: b(money(C.R2.voluntary_usd), "R2.voluntary_usd"), lab: "returned by the attacker or an insider" },
      { y: 340, h: 124, share: o, cls: "oth", pct: b(pct1(o), "C4.master_pct"), usd: b(money(C.C4.master_usd), "C4.master_usd"), lab: "other recorded recovery" },
      { y: 484, h: 178, share: u, cls: "none", pct: b(pct1(u), "derived.unrecovered_pct"), usd: b(money(A.derived.unrecovered_usd.v), "derived.unrecovered_usd"), lab: "no recorded recovery" },
    ];
    let y0 = L.y, paths = "";
    const col = { ret: "rgba(68,227,191,.42)", oth: "rgba(141,184,255,.40)", none: "url(#hz)" };
    nodes.forEach((n) => {
      const hw = L.h * n.share / 100, dh = Math.min(n.h, Math.max(hw, 24)), dy = n.y + (n.h - dh) / 2, x1 = L.x + L.w, x2 = RX, mx = (x1 + x2) / 2;
      paths += `<path d="M${x1},${y0} C${mx},${y0} ${mx},${dy} ${x2},${dy} L${x2},${dy + dh} C${mx},${dy + dh} ${mx},${y0 + hw} ${x1},${y0 + hw} Z" fill="${col[n.cls]}"/>`;
      y0 += hw;
    });
    const unv = (C.C1.pct_ex_unverified !== undefined && Math.abs(C.C1.pct - C.C1.pct_ex_unverified) >= 0.05)
      ? ` One amount in the totals is reported but not verified; without it, ${b(pct1(C.C1.pct_ex_unverified), "C1.pct_ex_unverified")}.` : "";
    return { tag: "Where the money went", src: `Includes company claims and unchecked outcomes. Other recovery: freezes, seizures, rollbacks, rescues and other routes.${unv}`,
      html: `<p class="h" style="font-size:66px;max-width:1200px"><span class="c-ret">${b(pct1(C.C1.pct), "C1.pct")}</span> of the ${b(money(C.S1.total_usd), "S1.total_usd")} stolen<br>has a recorded recovery.</p>
        <svg width="1440" height="668" style="position:absolute;left:0;top:0" aria-hidden="true"><defs><pattern id="hz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="rgba(74,85,104,.18)"/><rect width="3" height="12" fill="rgba(127,138,160,.36)"/></pattern></defs>${paths}</svg>
        <div class="panel" style="position:absolute;left:${L.x}px;top:${L.y}px;width:${L.w}px;height:${L.h}px;display:flex;flex-direction:column;justify-content:center;padding:0 34px">
          <div style="font:400 84px/1 var(--display)">${b(money(C.S1.total_usd), "S1.total_usd")}</div><div class="lab" style="margin-top:14px">stolen in ${b(int(C.S1.n), "S1.n")} hacks</div></div>
        ${nodes.map((n) => `<div style="position:absolute;left:${RX}px;top:${n.y}px;width:540px;height:${n.h}px;padding:12px 26px;display:flex;flex-direction:column;justify-content:center;${n.cls === "none" ? "border:2px dashed var(--ink-3);background:var(--bg) var(--hatch)" : `background:var(--bg-2);border:2px solid var(--line-2);border-left:10px solid var(--${n.cls})`}">
          <div style="display:flex;gap:26px;align-items:baseline"><span style="font:400 64px/1 var(--display)" class="${n.cls === "none" ? "" : "c-" + n.cls}">${n.pct}</span><span style="font:400 36px/1 var(--mono);color:var(--ink-2)">${n.usd}</span></div>
          <div style="font:400 36px/1.15 var(--body);color:var(--ink-2);margin-top:8px">${n.lab}</div></div>`).join("")}` };
  };

  CARDS.poly = () => {
    const r = row("20210810-poly-network");
    need(r.ret > 0 && r.oth > 0 && r.who === "a", "Poly row shape");
    const k = "inc.rows[20210810-poly-network]";
    const p = Math.round(r.ret / r.loss * 100);
    return { tag: hexOff(r), src: `${DATASET()} Loss is the tracker-reported USD at the time of the hack.`,
      html: `<p class="kick">Case file · ${b(date(r.date), k + ".date")}</p>
        <div style="font:400 120px/1 var(--display)">${esc(r.name)}</div>
        <p class="lab" style="margin:22px 0 40px">Reported loss <b>${b(money(r.loss), k + ".loss")}</b> · ${esc(r.chain)}</p>
        ${bar(r, 90)}
        <div class="row" style="margin-top:46px;gap:110px">
          <div><div style="font:400 150px/.9 var(--display)" class="c-ret">${b(money(r.ret), k + ".ret")}</div><p class="lab" style="margin:16px 0 0">returned by the attacker, ${b(p + "%", k + ".ret / loss")} of the loss</p></div>
          <div><div style="font:400 150px/.9 var(--display)" class="c-oth">${b(money(r.oth), k + ".oth")}</div><p class="lab" style="margin:16px 0 0">frozen</p></div>
        </div>
        <p style="position:absolute;left:0;bottom:0;margin:0;font:700 44px/1.2 var(--body)">${ENF[r.enf]}</p>` };
  };

  CARDS.euler = () => {
    const r = row("20230313-euler-v1"), k = `inc.rows[${r.id}]`;
    need(r.ret >= r.loss, "Euler fully recovered");
    const a = Q[7], z = Q[6];
    need(/Euler/.test(a.case) && /Euler/.test(z.case), "Euler quotes");
    return { tag: "On chain · " + b(mon(r.date), k + ".date"), src: `Decoded transaction input data, Ethereum. Text verbatim. ${DATASET()}`,
      html: `<p class="h" style="font-size:58px">Euler lost ${b(money(r.loss), k + ".loss")}.<br>It got all of it back.</p>
        <div style="margin-top:24px">${msg(a, "quotes[rank 7]")}<div class="gap">${b(gap(a.time, z.time), "quotes[rank 7,6].time")}</div>${msg(z, "quotes[rank 6]")}</div>` };
  };

  CARDS.bybit = () => {
    const r = row("20250221-bybit"), k = `inc.rows[${r.id}]`;
    const m = rx("F1", "definition", /Tether freeze in Bybit caught \$(\d+)k of about \$([\d.]+)B, about ([\d.]+)%/);
    need(A.facts.bybit_tether.v === "$" + m[1] + "k", "F1 and F2 Bybit Tether figures differ");
    const share = (+m[1] * 1e3) / (+m[2] * 1e9) * 100, nCell = Math.max(1, Math.round(share / 0.01));
    const cells = Array.from({ length: 10000 }, (_, i) => i);
    const hot = new Set(cells.slice(0, nCell).map((i) => 4262 + i));
    return { tag: b(date(r.date), k + ".date"), src: `Loss as estimated by Bybit and Elliptic; the incident index uses the tracker's ${b(money(r.loss), k + ".loss")}. Attribution: FBI. ${DATASET()}`,
      html: `<div style="position:absolute;left:0;top:0;width:760px">
          <p class="kick">Bybit</p>
          <span class="tag c-dprk">North Korea, government attribution</span>
          <div class="big c-oth" style="font-size:230px;margin-top:56px">${b("$" + m[1] + "k", "F1.definition / facts.bybit_tether")}</div>
          <p class="lab" style="margin:26px 0 0;font-size:46px">frozen by Tether, out of about <b>${b("$" + m[2] + "B", "F1.definition")}</b> stolen.</p>
          <p style="font:400 92px/1 var(--display);margin:40px 0 0">≈ ${b(m[3] + "%", "F1.definition")}</p></div>
        <div style="position:absolute;right:0;top:0;width:520px">
          <svg width="520" height="520" viewBox="0 0 100 100" shape-rendering="crispEdges" style="display:block;background:#1a2130">
            <defs><pattern id="g" width="1" height="1" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="none" stroke="rgba(127,138,160,.55)" stroke-width=".14"/></pattern></defs>
            <pattern id="g10" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="none" stroke="rgba(169,179,195,.55)" stroke-width=".35"/></pattern><rect width="100" height="100" fill="url(#g)"/><rect width="100" height="100" fill="url(#g10)"/>
            ${[...hot].map((i) => `<rect x="${i % 100}" y="${Math.floor(i / 100)}" width="1" height="1" fill="#8db8ff"/>`).join("")}
            ${[...hot].map((i) => `<circle cx="${i % 100 + .5}" cy="${Math.floor(i / 100) + .5}" r="5" fill="none" stroke="#8db8ff" stroke-width=".5"/>`).join("")}
          </svg>
          <p style="font:400 28px/1.25 var(--mono);color:var(--ink-2);margin:18px 0 0">10,000 squares = the theft.<br>The blue one is what Tether froze.</p></div>` };
  };

  CARDS.dprk = () => {
    const r = row("20220323-ronin-bridge"), k = `inc.rows[${r.id}]`;
    need(r.dprk === 2, "Ronin government tier");
    return { tag: "North Korea", src: `Government: FBI, DOJ, OFAC, UN or multilateral reports, joint statements, Korean or Japanese police. Recovery counts company claims.`,
      html: `<div class="row" style="gap:90px">
          <div style="width:700px"><div class="big c-dprk" style="font-size:200px">${b(pct1(C.D1.gov.pct), "D1.gov.pct")}</div>
            <p class="lab" style="margin:20px 0 0">of all stolen dollars came from hacks a government attributes to North Korea.</p></div>
          <div style="width:620px"><div class="big" style="font-size:200px">${b(pct1(C.D3.gov_only_pct), "D3.gov_only_pct")}</div>
            <p class="lab" style="margin:20px 0 0">of those dollars is recorded as recovered or frozen.</p></div></div>
        <div class="panel" style="position:absolute;left:0;right:0;bottom:0">
          <div class="panel-h"><span>Case file · ${esc(r.name)} · ${b(date(r.date), k + ".date")}</span><span class="c-dprk">North Korea, government attribution</span></div>
          <div class="panel-b" style="display:flex;gap:40px;align-items:center">
            <div style="flex:0 0 520px">${bar(r, 56)}</div>
            <div style="font:400 38px/1.25 var(--body)">Lost <b>${b(money(r.loss), k + ".loss")}</b>. ${esc(I.lines[r.id]).replace(/\$30M/, b(money(r.oth), k + ".oth")).replace(" No arrest", "<br><span class='c-2'>No arrest").replace(/found\.$/, "found.</span>")}</div></div></div>` };
  };

  CARDS.ftx = () => {
    const r = row("20221112-ftx"), k = `inc.rows[${r.id}]`;
    const cs = (X.cases || []).filter((c) => /^FTX-/.test(c.case_id));
    need(cs.length === 3, "three FTX case rows");
    need(/^Three people were charged/.test(I.lines[r.id] || ""), "FTX line in inc.lines");
    const vc = /"([^"]+)"/.exec(cs[0].incident); need(vc, "victim name in FTX case row");
    const st = (c) => {
      let m;
      if ((m = /pleaded guilty (\d{4}-\d\d-\d\d)/.exec(c.outcome))) {
        const p = /(\d+) months probation/.exec(c.outcome);
        return `<span class="c-arr">Pleaded guilty</span>, ${b(date(m[1]), c.case_id + ".outcome")}${p ? `. ${b(p[1], c.case_id + ".outcome")} months probation` : ""}.`;
      }
      if ((m = /plea agreement filed \(.*?under seal (\d{4}-\d\d-\d\d)/.exec(c.outcome))) return `<span class="c-arr">Plea agreement on file</span>, filed ${b(date(m[1]), c.case_id + ".outcome")}.`;
      if ((m = /no public disposition found.*?as of (\d{4}-\d\d-\d\d)/.exec(c.outcome))) return `No public disposition found as of ${b(date(m[1]), c.case_id + ".outcome")}.`;
      throw new Error("unrecognised FTX outcome: " + c.case_id);
    };
    const order = cs.slice().sort((x, y) => (/pleaded guilty/.test(y.outcome) - /pleaded guilty/.test(x.outcome)) || (/plea agreement/.test(y.outcome) - /plea agreement/.test(x.outcome)));
    return { tag: hexOff(r), src: `The indictment calls the victim "${esc(vc[1])}"; the link to FTX is from reporting. Case records: data/law_enforcement_cases.csv.`,
      html: `<p class="kick">Case file · ${b(date(r.date), k + ".date")}</p>
        <div style="font:400 104px/1 var(--display)">FTX hack</div>
        <p class="lab" style="margin:22px 0 34px">Reported loss <b>${b(money(r.loss), k + ".loss")}</b>. <b>${b(cs.length === 3 ? "Three" : cs.length, "law_enforcement_cases.csv FTX-*")}</b> people charged over a SIM-swap theft linked to it. Tether froze about <b>${b(money(r.oth), k + ".oth")}</b>.</p>
        <div class="panel">${order.map((c, j) => `<div style="display:flex;gap:40px;padding:22px 30px;${j ? "border-top:2px solid var(--line)" : ""}"><span style="flex:0 0 420px;font:500 40px/1.25 var(--mono)">${esc(c.defendant)}</span><span style="font:400 40px/1.25 var(--body)">${st(c)}</span></div>`).join("")}</div>` };
  };

  CARDS.bounty = () => {
    const a = Q[2], z = Q[3];
    need(/Shezmu/.test(a.case) && /Shezmu/.test(z.case), "Shezmu quotes");
    const ch0 = C.C3.channels[0]; need(/voluntary/.test(ch0.channel), "C3 channel 0 is voluntary return");
    return { tag: "On chain", src: `Offers: ${b(A.derived.openings_table_n.v, "derived.openings_table_n")} on-chain opening offers since 2020. Messages: decoded input data, verbatim. ${DATASET()}`,
      html: `<div style="position:absolute;left:0;top:0;width:520px">
          <div class="big" style="font-size:190px">${b(A.derived.opening_median_pct.v + "%", "derived.opening_median_pct")}</div>
          <p class="lab" style="margin:16px 0 0;font-size:38px">is the usual opening bounty offer, the median every year since ${b(C.R3.opening_yearly_median_10_since, "R3.opening_yearly_median_10_since")}.</p>
          <div style="font:400 104px/1 var(--display);margin-top:40px" class="c-ret">${b(ch0.pct + "%", "C3.channels[0].pct")}</div>
          <p class="lab" style="margin:12px 0 0;font-size:38px">of recovered dollars was handed back by attackers or insiders.</p></div>
        <div style="position:absolute;right:0;top:0;width:880px;--mt:33px">
          <p class="kick" style="margin-bottom:14px">Shezmu · ${b(mon(a.time), "quotes[rank 2].time")}</p>
          ${msg(a, "quotes[rank 2]")}<div class="gap">${b(gap(a.time, z.time), "quotes[rank 2,3].time")}</div>${msg(z, "quotes[rank 3]")}</div>` };
  };

  CARDS.arrests = () => {
    const T = A.charts.top100; need(T.length === 100, "top100 length");
    const cnt = A.charts.top100_counts;
    need(cnt.charged_for_hack === C.E1.top100_strict, "top100 counts vs E1");
    const cls = (s) => ({ charged_for_hack: "background:var(--arr)", laundering_side_only: "border:5px solid var(--arr)", civil_or_regulatory_only: "border:5px solid var(--ink-3)", not_for_the_hack: "border:5px solid var(--ink-3)" }[s] || "background:var(--hatch);border:2px solid var(--line-2)");
    const E3 = C.E3;
    const mo = (E3.median_days_2016_plus_in_headline_scope / 30.4375).toFixed(1);
    return { tag: "Arrests", src: `Searched for the largest hacks and a list of known cases, so counts are floors. One match is inferred. ${DATASET()}`,
      html: `<div style="position:absolute;left:0;top:0;width:700px">
          <div class="big c-arr" style="font-size:230px">${b(C.E1.top100_strict, "E1.top100_strict")}</div>
          <p class="lab" style="margin:16px 0 0;font-size:40px">of the 100 largest hacks led to an arrest or charge for the hack itself.</p>
          <div style="font:400 80px/1 var(--display);margin-top:38px">${b(E3.median_days_2016_plus_in_headline_scope, "E3.median_days_2016_plus_in_headline_scope")} days</div>
          <p class="lab" style="margin:10px 0 0;font-size:34px">median to the first recorded action against a person, about ${b(mo, "E3.median_days_2016_plus_in_headline_scope / 30.4375")} months (${b(E3.n_2016_plus_in_headline_scope, "E3.n_2016_plus_in_headline_scope")} cases, including laundering cases and one employee detention).</p></div>
        <div style="position:absolute;right:0;top:0;width:720px">
          <div style="display:grid;grid-template-columns:repeat(10,44px);gap:8px;width:512px;margin-left:auto">${T.map((t) => `<i style="display:block;height:44px;position:relative;${cls(t.status)}">${t.dprk_gov ? '<b style="position:absolute;right:4px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--dprk)"></b>' : ""}</i>`).join("")}</div>
          <div class="key" style="margin-top:22px;font-size:24px;gap:8px 22px;justify-content:flex-end"><span><i class="sw arr"></i>Charged for the hack ${b(cnt.charged_for_hack, "charts.top100_counts.charged_for_hack")}</span><span><i class="sw ol-arr"></i>Laundering only ${b(cnt.laundering_side_only, "charts.top100_counts.laundering_side_only")}</span><span><i class="sw ol-ink"></i>Other action ${b(cnt.civil_or_regulatory_only + cnt.not_for_the_hack, "charts.top100_counts.civil_or_regulatory_only + not_for_the_hack")}</span><span><i class="sw none"></i>None found ${b(cnt.none_found, "charts.top100_counts.none_found")}</span><span><i class="sw" style="width:16px;height:16px;border-radius:50%;background:var(--dprk)"></i>North Korea, government</span></div></div>` };
  };

  CARDS.court = () => {
    const cs = Object.fromEntries((X.cases || []).map((c) => [c.case_id, c]));
    const u = cs["URAN-1"], m = cs["MANGO-1"];
    need(u && m, "URAN-1 and MANGO-1 case rows");
    const uc = /convicted by jury on all counts (\d{4}-\d\d-\d\d)/.exec(u.outcome); need(uc, "Uranium conviction date");
    const us = /sentencing reported for (\d{4}-\d\d-\d\d)/.exec(u.outcome);
    const mv = /convicted (\d{4}-\d\d-\d\d).*?(\d{4}-\d\d-\d\d) opinion.*?vacated.*?acquittal on count 3.*?notice of appeal filed (\d{4}-\d\d-\d\d)/.exec(m.outcome); need(mv, "Mango outcome");
    const o = C.E4.outcomes;
    const G = [["convicted_or_pleaded", "var(--arr)", "Convicted, pleaded guilty or plea agreement"], ["at_large_or_not_in_custody", "var(--hatch)", "Charged; no public custody record"],
      ["pending", "var(--ink-3)", "Pending"], ["acquitted", "var(--ink)", "Acquitted"], ["conviction_vacated_or_acquitted_appeal_pending", "var(--oth)", "Vacated, appeal pending"], ["outcome_unknown", "var(--line-2)", "Unknown"]];
    const tot = G.reduce((s, g) => s + o[g[0]], 0); need(tot === C.E4.individuals, "E4 outcomes sum");
    const panel = (c, title, head, body, color) => `<div class="panel" style="flex:1"><div class="panel-h"><span>${esc(title)}</span><span>${esc(c.defendant)}</span></div>
      <div class="panel-b"><div style="font:400 64px/1.05 var(--display)" class="${color}">${head}</div><p class="lab" style="margin:14px 0 0;font-size:36px">${body}</p></div></div>`;
    return { tag: "In court", src: `Case records: data/law_enforcement_cases.csv (DOJ releases and dockets). ${DATASET()}`,
      html: `<p class="h" style="font-size:60px">Court cases cut both ways.</p>
        <div class="row" style="gap:36px;margin-top:26px">
          ${panel(u, "Uranium Finance", "Convicted", `By a jury on all counts, ${b(date(uc[1]), "URAN-1.outcome")}.${us ? ` Sentencing reported for ${b(date(us[1]), "URAN-1.outcome")}.` : ""}`, "c-arr")}
          ${panel(m, "Mango Markets", "Overturned", `Convicted ${b(date(mv[1]), "MANGO-1.outcome")}. In ${b(mon(mv[2]), "MANGO-1.outcome")} a judge vacated two counts and acquitted on the third. The US appealed.`, "c-oth")}
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0">
          <p style="font:400 32px/1.2 var(--body);color:var(--ink-2);margin:0 0 12px">What happened to the <b style="color:var(--ink)">${b(C.E4.individuals, "E4.individuals")}</b> people charged over a hack or its laundering</p>
          <div style="display:flex;gap:6px">${G.flatMap((g) => Array.from({ length: o[g[0]] }, () => `<i style="flex:1;height:38px;background:${g[1]};${g[0] === "at_large_or_not_in_custody" ? "border:2px solid var(--line-2)" : ""}"></i>`)).join("")}</div>
          <div class="key" style="margin-top:12px;font-size:23px;gap:6px 22px">${G.map((g) => `<span><i class="sw" style="background:${g[1]};${g[0] === "at_large_or_not_in_custody" ? "border:2px solid var(--line-2)" : ""}"></i>${g[2]} ${b(o[g[0]], "E4.outcomes." + g[0])}</span>`).join("")}</div></div>` };
  };

  CARDS.chain = () => {
    const ce = rowBy(/^Cetus/), cr = rowBy(/^Tectonic$/, (r) => r.ch === "k" && r.oth > 0);
    const kc = `inc.rows[${ce.id}]`, kr = `inc.rows[${cr.id}]`;
    need(ce.oth === C.M5.frozen_usd, "Cetus frozen != M5");
    const crp = cr.oth / cr.loss * 100;
    need(Math.abs(crp - parseFloat(A.facts.cronos_pct.v)) < 0.06, "Tectonic share != F1 Cronos restored share");
    const col = (r, k, big, lab, sub) => `<div style="flex:1"><p class="kick" style="margin-bottom:14px">${esc(r.name.replace(/ CLMM$/, ""))} · ${b(mon(r.date), k + ".date")}</p>
      <div style="font:400 150px/.9 var(--display)" class="c-oth">${big}</div><p class="lab" style="margin:20px 0 24px;min-height:150px;font-size:38px">${lab}</p>${bar(r, 56)}
      <p style="font:400 32px/1.25 var(--mono);color:var(--ink-2);margin:16px 0 0">${sub}</p></div>`;
    return { tag: "Chain interventions", src: `Cetus: canonical M5. Cronos (Tectonic): F1 and the recovery events. ${DATASET()}`,
      html: `<p class="h" style="font-size:52px">Sometimes the chain itself steps in.</p>
        <div class="row" style="gap:100px;margin-top:34px">
          ${col(ce, kc, b(money(ce.oth), kc + ".oth / M5.frozen_usd"), "frozen by Sui validators by the next day.", `${b(pct1(C.M5.frozen_pct), "M5.frozen_pct")} of the ${b(money(ce.loss), kc + ".loss")} loss`)}
          ${col(cr, kr, b(money(cr.oth), kr + ".oth"), `restored after Cronos spotted the attack in ${b(A.facts.cronos_minutes.v, "facts.cronos_minutes")}, halted the chain and rolled it back.`, `${b(A.facts.cronos_pct.v, "facts.cronos_pct")} of the ${b(money(cr.loss), kr + ".loss")} loss`)}
        </div>` };
  };

  function shotCard(key, title, url) {
    const img = X.shots && X.shots[key];
    need(img, "site screenshot " + key);
    return { bare: true, src: "",
      html: `<p style="position:absolute;left:80px;top:46px;margin:0;font:400 62px/1 var(--display)">${title}</p>
        <div class="frame" style="left:210px;top:138px;width:1180px"><div class="frame-bar"><i></i><i></i><i></i><span class="frame-url">${esc(url)}</span></div><img src="${img}" alt=""></div>` };
  }
  CARDS.site_lookup = () => shotCard("lookup", "Every hack has a case file", (X.site_host || "") + "/#lookup");
  CARDS.site_home = () => shotCard("home", "Every number, with its sources", X.site_host || "");

  /* ============================================================== render */
  const id = new URLSearchParams(location.search).get("card");
  const card = document.getElementById("card");
  try {
    need(CARDS[id], "unknown card " + id);
    const o = CARDS[id]();
    card.innerHTML = (o.bare ? "" : `<div class="top"><span class="logo">After<i>_</i>the<i>_</i>Hack</span><span class="tagr">${o.tag || ""}</span></div>
      <div class="body">${o.html}</div><div class="foot">${o.src}</div>`) + (o.bare ? o.html : "");
  } catch (e) {
    card.innerHTML = `<pre style="color:#ff5c93;font-size:28px;padding:40px;white-space:pre-wrap">${esc(e.stack || e)}</pre>`;
    window.__error = String(e);
  }
  window.__nums = NUMS;
  window.__overflow = () => {
    const box = card.getBoundingClientRect(), bad = [];
    card.querySelectorAll("*").forEach((el) => {
      if (el.closest("svg") && el.tagName !== "svg") return;
      const r = el.getBoundingClientRect();
      if (r.width && (r.right > box.right + 1 || r.bottom > box.bottom + 1 || r.left < box.left - 1)) bad.push(el.tagName + "." + el.className + " " + (el.textContent || "").slice(0, 40));
      if (el.scrollWidth > el.clientWidth + 2 && getComputedStyle(el).overflow === "hidden" && !el.classList.contains("frame-url")) bad.push("clip " + el.tagName + "." + el.className);
    });
    const bd = card.querySelector(".body"), ft = card.querySelector(".foot");
    if (bd) bd.querySelectorAll(":scope > *").forEach((el) => { const r = el.getBoundingClientRect(); if (r.bottom > bd.getBoundingClientRect().bottom + 1) bad.push("below body: " + el.tagName + "." + el.className + " " + (el.textContent || "").slice(0, 40)); });
    if (bd && ft && ft.textContent.trim() && ft.getBoundingClientRect().top < bd.getBoundingClientRect().bottom - 1) bad.push("foot overlaps body");
    return bad.slice(0, 8);
  };
  document.fonts.ready.then(() => { window.__ready = true; });
})();
</script>
</body>
</html>
